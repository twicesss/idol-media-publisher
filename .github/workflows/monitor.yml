name: Monitor X Accounts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-account-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate configuration
        run: python -m unittest discover -s tests -v

      - name: Monitor configured accounts
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          if [ -z "$X_BEARER_TOKEN" ]; then
            echo "::notice::X_BEARER_TOKEN is not configured yet; skipping live monitoring."
            exit 0
          fi
          python scripts/monitor.py

      - name: Save discovery state and report
        run: |
          if [ -f data/seen_posts.json ] || [ -f data/latest_report.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/seen_posts.json data/latest_report.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update X monitoring state"
              git push
            fi
          fi
