name: Check X Media Feeds

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-media-feed-check
  cancel-in-progress: false

jobs:
  check-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate configuration
        run: python -m unittest discover -s tests -v

      - name: Check media feeds
        run: python scripts/monitor.py

      - name: Save discovery state and report
        run: |
          if [ -f data/seen_posts.json ] || [ -f data/latest_report.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/seen_posts.json data/latest_report.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update media feed monitoring state"
              git push
            fi
          fi
